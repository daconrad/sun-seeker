<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Seeker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Sun Seeker</h1>
    <form id="weather-form">
        <input type="text" id="zip" placeholder="Enter Zip Code" required>
        <input type="number" id="temp" placeholder="Target Temperature (°F)" required>
        <button type="submit">Find Cities</button>
    </form>
    <div id="results"></div>
    <script src="script.js"></script>
</body>
</html>
