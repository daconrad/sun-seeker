<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Seeker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sun Seeker</h1>
        
        <div id="locationInput">
            <button id="detectLocation">Detect My Location</button>
            <div class="or-divider">OR</div>
            <div class="zip-input">
                <input type="text" id="zipCode" placeholder="Enter ZIP Code">
                <button id="submitZip">Submit</button>
            </div>
        </div>

        <div id="temperatureInput" style="display: none;">
            <input type="number" id="targetTemp" placeholder="Enter target temperature (°F)">
            <button id="findDestinations">Find Warm Destinations</button>
        </div>

        <div id="results">
            <ul id="destinationsList"></ul>
        </div>

        <div id="loading" style="display: none;">
            Searching for sunny destinations...
        </div>
    </div>

    <script src="js/weatherService.js"></script>
    <script src="js/locationService.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
